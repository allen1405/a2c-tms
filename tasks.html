<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <title>Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --bg2: #161618;
      --bg3: #1e1e22;
      --bg4: #26262c;
      --accent: #ff6b35;
      --accent2: #ff9a6c;
      --green: #30d158;
      --red: #ff453a;
      --yellow: #ffd60a;
      --blue: #0a84ff;
      --text: #f5f5f7;
      --text2: #ebebf5cc;
      --text3: #ebebf560;
      --border: rgba(255,255,255,0.08);
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
    
    /* APP SHELL */
    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    /* HEADER */
    .header {
      padding: calc(var(--safe-top) + 12px) 20px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .header-title { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; }
    .header-title span { color: var(--accent); }
    .header-date { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 4px; }
    .add-btn {
      width: 36px; height: 36px;
      background: var(--accent);
      border: none; border-radius: 50%;
      color: white; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,107,53,0.4);
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .add-btn:active { transform: scale(0.92); box-shadow: 0 2px 8px rgba(255,107,53,0.3); }

    /* FILTER TABS */
    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      background: var(--bg3);
      color: var(--text3);
    }
    .filter-tab.active { background: var(--accent); color: white; }
    .filter-tab .count {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.2);
      border-radius: 10px; padding: 0 6px;
      font-size: 11px; margin-left: 4px; min-width: 18px; height: 18px;
    }
    .filter-tab:not(.active) .count { background: rgba(255,255,255,0.1); color: var(--text2); }

    /* TASK LIST */
    .task-list { flex: 1; overflow-y: auto; padding: 12px 16px; padding-bottom: calc(var(--safe-bottom) + 12px); }
    .task-list::-webkit-scrollbar { display: none; }

    /* EMPTY STATE */
    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 50vh; color: var(--text3); text-align: center; gap: 12px;
    }
    .empty-icon { font-size: 48px; opacity: 0.5; }
    .empty-text { font-size: 16px; font-weight: 500; }
    .empty-sub { font-size: 13px; }

    /* TASK CARD */
    .task-card {
      background: var(--bg2);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      transition: transform 0.1s, opacity 0.3s;
      position: relative;
      overflow: hidden;
    }
    .task-card.done { opacity: 0.5; }
    .task-card:active { transform: scale(0.98); }
    .task-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 14px 0 0 14px;
    }
    .task-card.priority-high::before { background: var(--red); }
    .task-card.priority-medium::before { background: var(--yellow); }
    .task-card.priority-low::before { background: var(--blue); }

    .task-top { display: flex; align-items: flex-start; gap: 12px; }
    .task-check {
      width: 24px; height: 24px; flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid var(--bg4);
      background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1px;
    }
    .task-check.checked { background: var(--green); border-color: var(--green); }
    .task-check.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: 600; }

    .task-content { flex: 1; min-width: 0; }
    .task-title {
      font-size: 15px; font-weight: 500;
      line-height: 1.4;
      word-break: break-word;
    }
    .task-card.done .task-title { text-decoration: line-through; color: var(--text3); }
    .task-note { font-size: 13px; color: var(--text3); margin-top: 4px; line-height: 1.4; }

    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
    .meta-tag {
      font-size: 11px; font-family: 'DM Mono', monospace;
      padding: 3px 8px; border-radius: 6px;
      background: var(--bg3); color: var(--text3);
    }
    .meta-tag.cat { background: rgba(10,132,255,0.15); color: var(--blue); }
    .meta-tag.overdue { background: rgba(255,69,58,0.15); color: var(--red); }
    .meta-tag.due-soon { background: rgba(255,214,10,0.15); color: var(--yellow); }
    .meta-tag.done-tag { background: rgba(48,209,88,0.15); color: var(--green); }

    .task-times { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
    .task-time { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }

    .task-actions { display: flex; gap: 8px; margin-top: 10px; }
    .task-btn {
      padding: 6px 14px; border-radius: 8px; border: none;
      font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .task-btn:active { transform: scale(0.95); }
    .btn-done { background: rgba(48,209,88,0.15); color: var(--green); }
    .btn-undone { background: rgba(255,255,255,0.08); color: var(--text3); }
    .btn-delete { background: rgba(255,69,58,0.1); color: var(--red); }
    .btn-edit { background: rgba(255,255,255,0.08); color: var(--text2); }

    /* SECTION HEADER */
    .section-header {
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
      color: var(--text3); text-transform: uppercase;
      padding: 8px 4px 8px;
    }

    /* MODAL */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex; align-items: flex-end;
    }
    .modal {
      background: var(--bg2);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(var(--safe-bottom) + 20px);
      width: 100%;
      border-top: 1px solid var(--border);
      animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: var(--bg4); border-radius: 2px; margin: 0 auto 20px; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; display: block; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input {
      width: 100%; padding: 12px 14px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      transition: border-color 0.2s;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }
    textarea.form-input { resize: none; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .priority-btns { display: flex; gap: 8px; }
    .priority-btn {
      flex: 1; padding: 10px; border-radius: 10px; border: 2px solid transparent;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
      background: var(--bg3); color: var(--text3);
    }
    .priority-btn.sel-high { border-color: var(--red); background: rgba(255,69,58,0.1); color: var(--red); }
    .priority-btn.sel-medium { border-color: var(--yellow); background: rgba(255,214,10,0.1); color: var(--yellow); }
    .priority-btn.sel-low { border-color: var(--blue); background: rgba(10,132,255,0.1); color: var(--blue); }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn {
      flex: 1; padding: 14px; border-radius: 14px; border: none;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    .modal-btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--bg3); color: var(--text2); }

    /* STATS BAR */
    .stats-bar {
      display: flex; gap: 4px; padding: 0 16px 12px;
      flex-shrink: 0;
    }
    .stat-seg { flex: 1; height: 3px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
    .stat-seg-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s; }
    .stat-seg.done-seg .stat-seg-fill { background: var(--green); }
  </style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const STORAGE_KEY = 'alin_tasks_v1';

// HELPERS
const now = () => new Date().toISOString();
const fmtFull = (ts) => {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
};
const fmtDate = (ts) => {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
};
const todayStr = () => new Date().toISOString().split('T')[0];
const isOverdue = (due) => due && due < todayStr();
const isDueSoon = (due) => {
  if (!due || due < todayStr()) return false;
  const diff = (new Date(due) - new Date()) / 86400000;
  return diff <= 1;
};

// STORAGE
const loadTasks = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
const saveTasks = (tasks) => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));

// STATE
let tasks = loadTasks();
let filter = 'all';
let modal = null; // null | 'new' | 'edit'
let editId = null;
let form = { title: '', note: '', priority: 'medium', category: '', due: '' };

const CATS = ['TMS', 'Gore', 'YouTube', 'Personal', 'Business', 'Other'];

// RENDER
function render() {
  const app = document.getElementById('app');

  // Filter tasks
  let filtered = [...tasks];
  if (filter === 'active') filtered = filtered.filter(t => !t.done);
  if (filter === 'done') filtered = filtered.filter(t => t.done);
  if (filter === 'high') filtered = filtered.filter(t => t.priority === 'high' && !t.done);

  // Sort: active first, then by priority, then by created
  filtered.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const pOrder = { high: 0, medium: 1, low: 2 };
    if (pOrder[a.priority] !== pOrder[b.priority]) return pOrder[a.priority] - pOrder[b.priority];
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  const active = tasks.filter(t => !t.done).length;
  const done = tasks.filter(t => t.done).length;
  const high = tasks.filter(t => t.priority === 'high' && !t.done).length;
  const pct = tasks.length > 0 ? (done / tasks.length * 100) : 0;

  const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  app.innerHTML = `
    <div class="header">
      <div class="header-top">
        <div>
          <div class="header-title">My <span>Tasks</span></div>
          <div class="header-date">${today}</div>
        </div>
        <button class="add-btn" onclick="openNew()">+</button>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab ${filter==='all'?'active':''}" onclick="setFilter('all')">All <span class="count">${tasks.length}</span></button>
        <button class="filter-tab ${filter==='active'?'active':''}" onclick="setFilter('active')">Active <span class="count">${active}</span></button>
        <button class="filter-tab ${filter==='done'?'active':''}" onclick="setFilter('done')">Done <span class="count">${done}</span></button>
        ${high > 0 ? `<button class="filter-tab ${filter==='high'?'active':''}" onclick="setFilter('high')">🔴 High <span class="count">${high}</span></button>` : ''}
      </div>
    </div>

    ${tasks.length > 0 ? `
    <div class="stats-bar">
      <div class="stat-seg done-seg"><div class="stat-seg-fill" style="width:${pct}%"></div></div>
    </div>` : ''}

    <div class="task-list">
      ${filtered.length === 0 ? `
        <div class="empty">
          <div class="empty-icon">✅</div>
          <div class="empty-text">${filter === 'done' ? 'No completed tasks' : 'No tasks here'}</div>
          <div class="empty-sub">${filter === 'all' ? 'Tap + to add your first task' : ''}</div>
        </div>
      ` : filtered.map(t => renderTask(t)).join('')}
    </div>

    ${modal ? renderModal() : ''}
  `;
}

function renderTask(t) {
  const overdue = isOverdue(t.due);
  const soon = isDueSoon(t.due);
  return `
    <div class="task-card ${t.done ? 'done' : ''} priority-${t.priority}">
      <div class="task-top">
        <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleDone('${t.id}')"></div>
        <div class="task-content">
          <div class="task-title">${escHtml(t.title)}</div>
          ${t.note ? `<div class="task-note">${escHtml(t.note)}</div>` : ''}
        </div>
      </div>
      <div class="task-meta">
        ${t.category ? `<span class="meta-tag cat">${t.category}</span>` : ''}
        ${t.due && !t.done ? `<span class="meta-tag ${overdue ? 'overdue' : soon ? 'due-soon' : ''}">${overdue ? '⚠ ' : ''}Due ${fmtDate(t.due)}</span>` : ''}
        ${t.done ? `<span class="meta-tag done-tag">✓ Done</span>` : ''}
        <span class="meta-tag" style="margin-left:auto;font-size:10px">${t.priority.toUpperCase()}</span>
      </div>
      <div class="task-times">
        <div class="task-time">📌 ${fmtFull(t.createdAt)}</div>
        ${t.doneAt ? `<div class="task-time">✅ ${fmtFull(t.doneAt)}</div>` : ''}
      </div>
      <div class="task-actions">
        ${!t.done 
          ? `<button class="task-btn btn-done" onclick="toggleDone('${t.id}')">Mark Done</button>`
          : `<button class="task-btn btn-undone" onclick="toggleDone('${t.id}')">Undo</button>`}
        <button class="task-btn btn-edit" onclick="openEdit('${t.id}')">Edit</button>
        <button class="task-btn btn-delete" onclick="deleteTask('${t.id}')">Delete</button>
      </div>
    </div>
  `;
}

function renderModal() {
  const isEdit = modal === 'edit';
  return `
    <div class="modal-bg" onclick="closeModal(event)">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-title">${isEdit ? 'Edit Task' : 'New Task'}</div>
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input class="form-input" id="f-title" placeholder="What needs to be done?" value="${escHtml(form.title)}" oninput="form.title=this.value" onchange="form.title=this.value" onblur="form.title=this.value" />
        </div>
        <div class="form-group">
          <label class="form-label">Note</label>
          <textarea class="form-input" id="f-note" placeholder="Details..." oninput="form.note=this.value" onchange="form.note=this.value" onblur="form.note=this.value">${escHtml(form.note)}</textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-input" onchange="form.category=this.value">
              <option value="">None</option>
              ${CATS.map(c => `<option value="${c}" ${form.category===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-input" value="${form.due}" onchange="form.due=this.value" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Priority</label>
          <div class="priority-btns">
            <button class="priority-btn ${form.priority==='high'?'sel-high':''}" onclick="setPriority('high')">🔴 High</button>
            <button class="priority-btn ${form.priority==='medium'?'sel-medium':''}" onclick="setPriority('medium')">🟡 Med</button>
            <button class="priority-btn ${form.priority==='low'?'sel-low':''}" onclick="setPriority('low')">🔵 Low</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn btn-primary" onclick="saveTask()">${isEdit ? 'Save' : 'Add Task'}</button>
          <button class="modal-btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>
  `;
}

// ACTIONS
function setFilter(f) { filter = f; render(); }

function openNew() {
  form = { title: '', note: '', priority: 'medium', category: '', due: '' };
  modal = 'new'; editId = null;
  render();
  setTimeout(() => document.getElementById('f-title')?.focus(), 100);
}

function openEdit(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  form = { title: t.title, note: t.note || '', priority: t.priority, category: t.category || '', due: t.due || '' };
  modal = 'edit'; editId = id;
  render();
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  modal = null; render();
}

function setPriority(p) { form.priority = p; render(); setTimeout(() => {}, 0); }

function saveTask() {
  // Read directly from DOM for iOS compatibility
  const titleEl = document.getElementById('f-title');
  const noteEl = document.getElementById('f-note');
  if (titleEl) form.title = titleEl.value;
  if (noteEl) form.note = noteEl.value;
  if (!form.title.trim()) { alert('Title required'); return; }
  if (modal === 'edit' && editId) {
    tasks = tasks.map(t => t.id === editId ? { ...t, title: form.title.trim(), note: form.note.trim(), priority: form.priority, category: form.category, due: form.due } : t);
  } else {
    tasks.unshift({ id: Date.now().toString(), title: form.title.trim(), note: form.note.trim(), priority: form.priority, category: form.category, due: form.due, done: false, createdAt: now(), doneAt: null });
  }
  saveTasks(tasks);
  modal = null;
  render();
}

function toggleDone(id) {
  tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done, doneAt: !t.done ? now() : null } : t);
  saveTasks(tasks);
  render();
}

function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  tasks = tasks.filter(t => t.id !== id);
  saveTasks(tasks);
  render();
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// INIT
render();
</script>
</body>
</html>
