<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <title>Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e; --bg2: #161618; --bg3: #1e1e22; --bg4: #26262c;
      --accent: #ff6b35; --green: #30d158; --red: #ff453a; --yellow: #ffd60a; --blue: #0a84ff;
      --text: #f5f5f7; --text2: #ebebf5cc; --text3: #ebebf560; --border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .header { padding: calc(env(safe-area-inset-top, 44px) + 12px) 20px 16px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .header-title { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; }
    .header-title span { color: var(--accent); }
    .header-date { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 4px; }
    .add-btn { width: 36px; height: 36px; background: var(--accent); border: none; border-radius: 50%; color: white; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(255,107,53,0.4); }
    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab { padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; white-space: nowrap; background: var(--bg3); color: var(--text3); }
    .filter-tab.active { background: var(--accent); color: white; }
    .task-list { flex: 1; overflow-y: auto; padding: 12px 16px calc(env(safe-area-inset-bottom, 34px) + 12px); }
    .task-list::-webkit-scrollbar { display: none; }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: var(--text3); text-align: center; gap: 12px; }
    .empty-icon { font-size: 48px; }
    .task-card { background: var(--bg2); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--border); position: relative; overflow: hidden; }
    .task-card.done { opacity: 0.5; }
    .task-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .task-card.priority-high::before { background: var(--red); }
    .task-card.priority-medium::before { background: var(--yellow); }
    .task-card.priority-low::before { background: var(--blue); }
    .task-top { display: flex; align-items: flex-start; gap: 12px; }
    .task-check { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--bg4); background: var(--bg3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .task-check.checked { background: var(--green); border-color: var(--green); }
    .task-check.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: 600; }
    .task-content { flex: 1; min-width: 0; }
    .task-title { font-size: 15px; font-weight: 500; line-height: 1.4; word-break: break-word; }
    .task-card.done .task-title { text-decoration: line-through; color: var(--text3); }
    .task-note { font-size: 13px; color: var(--text3); margin-top: 4px; line-height: 1.4; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
    .meta-tag { font-size: 11px; font-family: 'DM Mono', monospace; padding: 3px 8px; border-radius: 6px; background: var(--bg3); color: var(--text3); }
    .meta-tag.cat { background: rgba(10,132,255,0.15); color: var(--blue); }
    .meta-tag.overdue { background: rgba(255,69,58,0.15); color: var(--red); }
    .meta-tag.done-tag { background: rgba(48,209,88,0.15); color: var(--green); }
    .task-times { margin-top: 8px; }
    .task-time { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
    .task-actions { display: flex; gap: 8px; margin-top: 10px; }
    .task-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; }
    .btn-done { background: rgba(48,209,88,0.15); color: var(--green); }
    .btn-undone { background: rgba(255,255,255,0.08); color: var(--text3); }
    .btn-delete { background: rgba(255,69,58,0.1); color: var(--red); }
    .btn-edit { background: rgba(255,255,255,0.08); color: var(--text2); }
    /* MODAL - permanent in DOM */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 100; display: none; align-items: flex-end; }
    .modal-bg.show { display: flex; }
    .modal { background: var(--bg2); border-radius: 24px 24px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom, 34px) + 20px); width: 100%; border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .modal-handle { width: 36px; height: 4px; background: var(--bg4); border-radius: 2px; margin: 0 auto 20px; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; display: block; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input { width: 100%; padding: 12px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; -webkit-appearance: none; }
    .form-input:focus { outline: none; border-color: var(--accent); }
    textarea.form-input { resize: none; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .priority-btns { display: flex; gap: 8px; }
    .priority-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid transparent; font-size: 13px; font-weight: 500; cursor: pointer; background: var(--bg3); color: var(--text3); font-family: 'DM Sans', sans-serif; }
    .priority-btn.sel-high { border-color: var(--red); background: rgba(255,69,58,0.1); color: var(--red); }
    .priority-btn.sel-medium { border-color: var(--yellow); background: rgba(255,214,10,0.1); color: var(--yellow); }
    .priority-btn.sel-low { border-color: var(--blue); background: rgba(10,132,255,0.1); color: var(--blue); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--bg3); color: var(--text2); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-title">My <span>Tasks</span></div>
        <div class="header-date" id="hdate"></div>
      </div>
      <button class="add-btn" onclick="openNew()">+</button>
    </div>
    <div class="filter-tabs" id="filter-tabs"></div>
  </div>
  <div class="task-list" id="task-list"></div>
</div>

<!-- MODAL - always in DOM, never re-rendered -->
<div class="modal-bg" id="modal-bg" onclick="bgClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">New Task</div>
    <div class="form-group">
      <label class="form-label">Title *</label>
      <input class="form-input" id="inp-title" type="text" placeholder="What needs to be done?" autocomplete="off" />
    </div>
    <div class="form-group">
      <label class="form-label">Note</label>
      <textarea class="form-input" id="inp-note" placeholder="Details..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-input" id="inp-cat">
          <option value="">None</option>
          <option>TMS</option><option>Gore</option><option>YouTube</option>
          <option>Personal</option><option>Business</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Due Date</label>
        <input class="form-input" id="inp-due" type="date" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Priority</label>
      <div class="priority-btns">
        <button class="priority-btn" id="pb-high" onclick="setPriority('high')">🔴 High</button>
        <button class="priority-btn sel-medium" id="pb-medium" onclick="setPriority('medium')">🟡 Med</button>
        <button class="priority-btn" id="pb-low" onclick="setPriority('low')">🔵 Low</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn btn-primary" onclick="saveTask()">Add Task</button>
      <button class="modal-btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'alin_tasks_v2';
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let filter = 'all';
let editId = null;
let curPriority = 'medium';

const now = () => new Date().toISOString();
const fmtFull = (ts) => { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); };
const fmtDate = (ts) => { if (!ts) return ''; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
const todayStr = () => new Date().toISOString().split('T')[0];
const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
const esc = (s) => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function setPriority(p) {
  curPriority = p;
  ['high','medium','low'].forEach(x => {
    const btn = document.getElementById('pb-'+x);
    btn.className = 'priority-btn' + (x===p ? ' sel-'+x : '');
  });
}

function openNew() {
  editId = null;
  document.getElementById('modal-title').textContent = 'New Task';
  document.querySelector('.modal-bg .btn-primary').textContent = 'Add Task';
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-note').value = '';
  document.getElementById('inp-cat').value = '';
  document.getElementById('inp-due').value = '';
  setPriority('medium');
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(() => document.getElementById('inp-title').focus(), 300);
}

function openEdit(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'Edit Task';
  document.querySelector('.modal-bg .btn-primary').textContent = 'Save';
  document.getElementById('inp-title').value = t.title;
  document.getElementById('inp-note').value = t.note || '';
  document.getElementById('inp-cat').value = t.category || '';
  document.getElementById('inp-due').value = t.due || '';
  setPriority(t.priority || 'medium');
  document.getElementById('modal-bg').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}

function bgClick(e) {
  if (e.target === document.getElementById('modal-bg')) closeModal();
}

function saveTask() {
  const title = document.getElementById('inp-title').value.trim();
  const note = document.getElementById('inp-note').value.trim();
  const category = document.getElementById('inp-cat').value;
  const due = document.getElementById('inp-due').value;
  if (!title) { alert('Please enter a title'); return; }
  if (editId) {
    tasks = tasks.map(t => t.id === editId ? {...t, title, note, priority: curPriority, category, due} : t);
  } else {
    tasks.unshift({ id: Date.now().toString(), title, note, priority: curPriority, category, due, done: false, createdAt: now(), doneAt: null });
  }
  save();
  closeModal();
  renderList();
  renderFilters();
}

function toggleDone(id) {
  tasks = tasks.map(t => t.id === id ? {...t, done: !t.done, doneAt: !t.done ? now() : null} : t);
  save(); renderList(); renderFilters();
}

function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  tasks = tasks.filter(t => t.id !== id);
  save(); renderList(); renderFilters();
}

function setFilter(f) { filter = f; renderFilters(); renderList(); }

function renderFilters() {
  const active = tasks.filter(t => !t.done).length;
  const done = tasks.filter(t => t.done).length;
  const high = tasks.filter(t => t.priority==='high' && !t.done).length;
  const tabs = [
    {f:'all', label:`All (${tasks.length})`},
    {f:'active', label:`Active (${active})`},
    {f:'done', label:`Done (${done})`},
    ...(high > 0 ? [{f:'high', label:`🔴 High (${high})`}] : [])
  ];
  document.getElementById('filter-tabs').innerHTML = tabs.map(t =>
    `<button class="filter-tab ${filter===t.f?'active':''}" onclick="setFilter('${t.f}')">${t.label}</button>`
  ).join('');
}

function renderList() {
  let filtered = [...tasks];
  if (filter === 'active') filtered = filtered.filter(t => !t.done);
  if (filter === 'done') filtered = filtered.filter(t => t.done);
  if (filter === 'high') filtered = filtered.filter(t => t.priority==='high' && !t.done);
  filtered.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const p = {high:0,medium:1,low:2};
    if (p[a.priority] !== p[b.priority]) return p[a.priority]-p[b.priority];
    return new Date(b.createdAt)-new Date(a.createdAt);
  });
  const el = document.getElementById('task-list');
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✅</div><div>No tasks here</div></div>`;
    return;
  }
  el.innerHTML = filtered.map(t => {
    const overdue = t.due && t.due < todayStr() && !t.done;
    return `
    <div class="task-card ${t.done?'done':''} priority-${t.priority}">
      <div class="task-top">
        <div class="task-check ${t.done?'checked':''}" onclick="toggleDone('${t.id}')"></div>
        <div class="task-content">
          <div class="task-title">${esc(t.title)}</div>
          ${t.note ? `<div class="task-note">${esc(t.note)}</div>` : ''}
        </div>
      </div>
      <div class="task-meta">
        ${t.category ? `<span class="meta-tag cat">${t.category}</span>` : ''}
        ${t.due && !t.done ? `<span class="meta-tag ${overdue?'overdue':''}">Due ${fmtDate(t.due)}</span>` : ''}
        ${t.done ? `<span class="meta-tag done-tag">✓ Done</span>` : ''}
      </div>
      <div class="task-times">
        <div class="task-time">📌 ${fmtFull(t.createdAt)}</div>
        ${t.doneAt ? `<div class="task-time">✅ ${fmtFull(t.doneAt)}</div>` : ''}
      </div>
      <div class="task-actions">
        ${!t.done ? `<button class="task-btn btn-done" onclick="toggleDone('${t.id}')">Mark Done</button>` : `<button class="task-btn btn-undone" onclick="toggleDone('${t.id}')">Undo</button>`}
        <button class="task-btn btn-edit" onclick="openEdit('${t.id}')">Edit</button>
        <button class="task-btn btn-delete" onclick="deleteTask('${t.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// INIT
document.getElementById('hdate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
renderFilters();
renderList();
</script>
</body>
</html>
